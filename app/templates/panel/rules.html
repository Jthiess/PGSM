{% extends 'panel_base.html' %}
{% block title %}Server Rules{% endblock %}

{% block content %}
<div class="rules-page">
    <div class="rules-page-header">
        <div>
            <a href="{{ url_for('panel.index') }}" class="rules-back-link">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Back to Servers
            </a>
            <h1 class="rules-title">Server Rules</h1>
            <p class="rules-subtitle">Read and follow these rules when playing on our servers.</p>
        </div>
    </div>

    <div class="rules-content">
        {{ rules_html|safe }}
    </div>

    <div class="rules-footer">
        <a class="btn btn-primary" href="{{ url_for('whitelist_panel.index') }}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16,11 18,13 22,9"/></svg>
            Apply to Whitelist
        </a>
        <a class="btn btn-secondary" href="{{ url_for('panel.index') }}">Back to Servers</a>
    </div>
</div>
{% endblock %}
