{% extends 'panel_base.html' %}
{% block title %}Edit rules.md{% endblock %}

{% block content %}
<div class="admin-page">
    <div class="admin-page-header">
        <h1 class="admin-page-title">Edit rules.md</h1>
        <div class="admin-page-actions">
            <a href="{{ url_for('admin_panel.panel') }}" class="btn btn-secondary btn-sm">Back</a>
            <form method="post" action="{{ url_for('admin_panel.logout') }}" style="display:inline;">
                <button class="btn btn-warning btn-sm" type="submit">Log out</button>
            </form>
        </div>
    </div>

    <div class="pub-form-card">
        <p class="form-hint" style="margin-bottom: 1rem;">Edit server rules in Markdown format. Changes appear on the /rules page.</p>
        <form method="post">
            <div class="form-group">
                <label class="form-label" for="content">rules.md</label>
                <textarea id="content" name="content" rows="22" style="font-family: var(--mono); font-size: 0.875rem; resize: vertical;">{{ content }}</textarea>
            </div>
            <div class="flex gap-1 items-center" style="margin-top: 0.75rem;">
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="{{ url_for('panel.rules') }}" class="btn btn-secondary" target="_blank" rel="noopener">Preview Rules Page</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
