{% extends 'base.html' %}
{% block title %}Edit messages.txt{% endblock %}
{% block breadcrumb %}<span>›</span> <a href="{{ url_for('admin_panel.messages') }}">Messages</a>{% endblock %}

{% block content %}
<div class="admin-page">
    <div class="admin-page-header">
        <h1 class="admin-page-title">Edit messages.txt</h1>
    </div>

    <div class="pub-form-card">
        <p class="form-hint" style="margin-bottom: 1rem;">One message per line. A random line is shown on the homepage.</p>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label" for="content">messages.txt</label>
                <textarea id="content" name="content" rows="14" style="font-family: var(--mono); font-size: 0.875rem; resize: vertical;">{{ content }}</textarea>
            </div>
            <div class="flex gap-1 items-center" style="margin-top: 0.75rem;">
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="{{ url_for('panel.index') }}" class="btn btn-secondary" target="_blank" rel="noopener">View Site</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
